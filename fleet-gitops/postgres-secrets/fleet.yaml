defaultNamespace: farm-server

labels:
  app.kubernetes.io/name: jyga-postgres-secrets

dependsOn:
  - selector:
      matchLabels:
        app.kubernetes.io/name: jyga-base

targetCustomizations:

  - name: farm-five
    clusterSelector:
      matchLabels:
        Farm: "five"
    yaml:
      overlays:
        - secrets/farm-five

  - name: farm-four
    clusterSelector:
      matchLabels:
        Farm: "four"
    yaml:
      overlays:
        - secrets/farm-four

targets:
  - name: match
    clusterSelector:
      matchExpressions:
        - key: Farm
          operator: In
          values:
            - "five"
        - key: Postgres          # ← seulement si le cluster a aussi postgres
          operator: Exist
          

  - name: no-match
    clusterSelector:
      matchExpressions:
        - key: Farm
          operator: NotIn
          values:
            - "five"
          
    ignore:
      conditions:
        - type: Ready
    doNotDeploy: true