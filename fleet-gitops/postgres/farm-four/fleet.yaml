defaultNamespace: farm-server

dependsOn:
  - name: jyga-dev-fleet-gitrepo-fleet-gitops-base

helm:
  repo: https://lwtchami.github.io/helmcharts
  chart: jyga-postgres
  releaseName: postgres-instance

targets:
  - name: postgres-0-1-0-farm-four
    clusterSelector:
      matchLabels:
        Postgres: "0.1.0"
        Farm: "four"
    helm:
      version: "0.1.0"
      valuesFiles:               
        - overlays/values.yaml

  - name: postgres-0-1-0-no-farm
    clusterSelector:
      matchLabels:
        Postgres: "0.1.0"
      matchExpressions:
        - key: Farm
          operator: DoesNotExist
    ignore:
      conditions:
        - type: Ready
    doNotDeploy: true

  - name: no-match
    clusterSelector:
      matchExpressions:
        - key: Postgres
          operator: NotIn
          values:
            - "0.1.0"
           
    ignore:
      conditions:
        - type: Ready
    doNotDeploy: true