# farm-four/fleet.yaml — simplifié, plus de no-match à gérer
defaultNamespace: farm-server

dependsOn:
  - name: jyga-dev-fleet-gitrepo-fleet-gitops-base

helm:
  repo: https://lwtchami.github.io/helmcharts
  chart: jyga-postgres
  releaseName: postgres-instance
  version: "0.1.0"
  valuesFiles:
    - values.yaml

targets:
  - name: deploy
    clusterSelector:
      matchLabels:
        Postgres: "0.1.0"
        Farm: "four"