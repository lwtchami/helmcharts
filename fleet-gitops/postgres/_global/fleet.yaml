# _global/fleet.yaml — garde-fou central
defaultNamespace: farm-server

helm:
  repo: https://lwtchami.github.io/helmcharts
  chart: jyga-postgres
  releaseName: postgres-instance

targets:
  - name: postgres-no-farm
    clusterSelector:
      matchLabels:
        Postgres: "0.1.0"
      matchExpressions:
        - key: Farm
          operator: DoesNotExist
    ignore:
      conditions:
        - type: Ready
    doNotDeploy: true

  - name: no-match
    clusterSelector:
      matchExpressions:
        - key: Postgres
          operator: NotIn
          values:
            - "0.1.0"
    ignore:
      conditions:
        - type: Ready
    doNotDeploy: true