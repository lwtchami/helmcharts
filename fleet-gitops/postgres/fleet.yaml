defaultNamespace: farm-server

dependsOn:
  - name: jyga-dev-fleet-gitrepo-fleet-gitops-base

helm:
  repo: https://lwtchami.github.io/helmcharts
  chart: jyga-postgres
  releaseName: postgres-instance

targets:
  - name: postgres-0-1-0
    clusterSelector:
      matchLabels:
        Postgres: "0.1.0"
        Farm: "five"
    helm:
      version: "0.1.0"
      valuesFiles:
        - overlays/five/values.yaml
 
  - name: no-match
    clusterSelector:
      matchExpressions:
        - key: Postgres
          operator: NotIn
          values:
            - "0.1.0"
           
    ignore:
      conditions:
        - type: Ready
    doNotDeploy: true