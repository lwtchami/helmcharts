defaultNamespace: farm-server

labels:
  app.kubernetes.io/name: jyga-postgres-five 

dependsOn:
  - name: jyga-dev-fleet-gitrepo-fleet-gitops-base

helm:
  repo: https://lwtchami.github.io/helmcharts
  chart: jyga-postgres
  releaseName: postgres-instance
  recreate: true

targets:

  - name: deploy
    clusterSelector:
      matchLabels:
        Postgres: "0.1.0"
        Farm: "five"
    helm:
      version: "0.1.0"
      valuesFiles:
        - values.yaml
    yaml:
      overlays: 
        - overlays

  - name: no-match-farm
    clusterSelector:
      matchExpressions:
        - key: Farm
          operator: NotIn
          values:
            - "five"
    ignore:
      conditions:
        - type: Ready
    doNotDeploy: true

  - name: no-match-version
    clusterSelector:
      matchExpressions:
        - key: Postgres
          operator: NotIn
          values:
            - "0.1.0"
    ignore:
      conditions:
        - type: Ready
    doNotDeploy: true