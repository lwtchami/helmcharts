defaultNamespace: mynginx

labels:
  app.kubernetes.io/name: jyga-mynginx

helm:
  repo: https://lwtchami.github.io/helmcharts
  chart: mynginx
  releaseName: mynginxtest

targets:
  - name: mynginx-0-1-0
    clusterSelector:
      matchLabels:
        Mynginx: "0.1.0"
    helm:
      version: "0.1.0"
      values:
        clusterName: ""

  - name: mynginx-0-1-1
    clusterSelector:
      matchLabels:
        Mynginx: "0.1.1"
    helm:
      version: "0.1.1"
      values:
        clusterName: ""

 
  - name: no-match
    clusterSelector:
      matchExpressions:
        - key: Mynginx
          operator: NotIn
          values:
            - "0.1.0"
            - "0.1.1"
           
    ignore:
      conditions:
        - type: Ready
    doNotDeploy: true