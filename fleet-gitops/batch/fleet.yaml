defaultNamespace: farm-server

dependsOn:
  - name: jyga-dev-fleet-gitrepo-fleet-gitops-minio
  - name: jyga-dev-fleet-gitrepo-fleet-gitops-postgres-fa-2f9ab

helm:
  repo: https://lwtchami.github.io/helmcharts
  chart: jyga-batch
  releaseName: batch-instance

targets:
  - name: batch-0-1-0
    clusterSelector:
      matchLabels:
        Batch: "0.1.0"
    helm:
      version: "0.1.0"
      values:
        clusterName: ""
 
  - name: no-match
    clusterSelector:
      matchExpressions:
        - key: Batch
          operator: NotIn
          values:
            - "0.1.0"
           
    ignore:
      conditions:
        - type: Ready
    doNotDeploy: true