defaultNamespace: redis

helm:
  repo: https://lwtchami.github.io/helmcharts
  chart: xavki_redis
  releaseName: mytestredist

targets:
  - name: redis-0-1-2
    clusterSelector:
      matchLabels:
        redis: "0.1.2"
    helm:
      version: "0.1.2"
      valuesFiles:
        - values-common.yaml
        - values-0.1.2.yaml

  - name: redis-0-1-3
    clusterSelector:
      matchLabels:
        redis: "0.1.3"
    helm:
      version: "0.1.3"
      valuesFiles:
        - values-common.yaml
        - values-0.1.3.yaml