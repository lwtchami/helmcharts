defaultNamespace: redis

helm:
  repo: https://lwtchami.github.io/helmcharts
  chart: xavki_redis
  releaseName: mytestredist

  targets:
  - name: redis-0-1-2
    clusterSelector:
      matchExpressions:
        - key: Redis
          operator: In
          values:
            - "0.1.2"
    helm:
      version: "0.1.2"
      values:
        redis_port: "6379"

  - name: redis-0-1-3
    clusterSelector:
      matchExpressions:
        - key: Redis
          operator: In
          values:
            - "0.1.3"
    helm:
      version: "0.1.3"
      values:
        redis_port: "6380"

        