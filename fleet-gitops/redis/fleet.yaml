defaultNamespace: redis

helm:
  repo: https://lwtchami.github.io/helmcharts
  chart: xavki_redis
  releaseName: mytestredist

targets:
  - name: redis-0-1-2
    clusterSelector:
      matchLabels:
        Redis: "0.1.2"
    helm:
      version: "0.1.2"
      values:
        redis_port: "6379"

  - name: redis-0-1-3
    clusterSelector:
      matchLabels:
        Redis: "0.1.3"
    helm:
      version: "0.1.3"
      values:
        redis_port: "6380"
  
  - name: redis-0-1-4
    clusterSelector:
      matchLabels:
        Redis: "0.1.4"
    helm:
      version: "0.1.4"
      values:
        redis_port: "6384"

  - name: no-match
    clusterSelector:
      matchExpressions:
        - key: Redis
          operator: NotIn
          values:
            - "0.1.2"
            - "0.1.3"
            - "0.1.4"
    ignore:
      conditions:
        - type: Ready
    doNotDeploy: true