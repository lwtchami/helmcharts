apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Values.statefulSet.metadata.name }}
spec:
  serviceName: {{ .Values.statefulSet.spec.serviceName }}
  replicas: {{ .Values.statefulSet.spec.replicas }}

  selector:
    matchLabels:
      app: {{ .Values.statefulSet.spec.selector.matchLabels.app }}

  template:
    metadata:
      labels:
        app: {{ .Values.statefulSet.spec.template.metadata.labels.app }}
    spec:

      securityContext:
        fsGroup: 999

      initContainers:
      {{- range .Values.statefulSet.spec.template.spec.initContainers }}
        - name: {{ .name }}
          image: {{ .image }}
          imagePullPolicy: {{ .imagePullPolicy }}
          command:
          {{- range .command }}
            - {{ . | quote }}
          {{- end }}
          volumeMounts:
          {{- range .volumeMounts }}
            - mountPath: {{ .mountPath }}
              name: {{ .name }}
          {{- end }}
      {{- end }}

      containers:
      {{- range .Values.statefulSet.spec.template.spec.containers }}
        - name: {{ .name }}
          image: {{ .image }}
          imagePullPolicy: {{ .imagePullPolicy }}

          ports:
          {{- toYaml .ports | nindent 12 }}

          envFrom:
          {{- toYaml .envFrom | nindent 12 }}

          env:
          {{- toYaml .env | nindent 12 }}
          {{- toYaml .initbd | nindent 12 }}

          volumeMounts:
          {{- toYaml .volumeMounts | nindent 12 }}

          # ✅ HEALTHCHECKS
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5

          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          # ✅ RESOURCES
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          # ✅ SECURITY
          securityContext:
            runAsUser: 999
            runAsGroup: 999
      {{- end }}

  volumeClaimTemplates:
    - metadata:
        name: postgredb
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.persistentVolumeClaim.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}