apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClassName | quote }}
  labels:
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/name: {{ .Chart.Name | quote }}
  {{- if .Values.setAsDefault }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  {{- end }}
provisioner: rancher.io/local-path

# Empêche le binding tant que le pod n'est pas schedulé (important pour local storage)
volumeBindingMode: WaitForFirstConsumer

# Sécurisé avec valeur par défaut
reclaimPolicy: {{ .Values.reclaimPolicy | default "Delete" | quote }}

parameters:
  # Pattern robuste (évite les noms invalides)
  pathPattern: {{ .Values.pathPattern | default "{{ .PVC.Namespace }}-{{ .PVC.Name }}" | quote }}